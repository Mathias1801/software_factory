[project]
name = "software-factory"
version = "0.1.0"
description = "Agentic software factory: plan, build, QA, deploy, monitor"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "anthropic>=0.40"]

[project.optional-dependencies]
checks = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
